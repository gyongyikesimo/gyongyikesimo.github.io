<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle Weather</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #vis { width: 90vw; max-width: 800px; height: 50vh; max-height: 400px; }
    </style>
</head>
<body>
    <div id="vis"></div>
    <script>
        const vlSpec = {
            $schema: 'https://vega.github.io/schema/vega-lite/v5.json',
            data: { url: 'data/seattle-weather.csv' },
            mark: 'bar',
            encoding: {
                x: {
                    timeUnit: 'month',
                    field: 'date',
                    type: 'ordinal'
                },
                y: {
                    aggregate: 'mean',
                    field: 'precipitation'
                }
            }
        };
        vegaEmbed('#vis', vlSpec, { actions: false }).catch(console.error);
    </script>
</body>
</html>
